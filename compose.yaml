services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zepto_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - zepto-research-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zepto_research"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zepto-research-postgres:
